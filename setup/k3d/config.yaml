apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: simple-cluster
servers: 1
agents: 3
network: k3dcluster
volumes:
  # Bind-mounts the repo's mnt/ directory into every node as the local-path
  # provisioner storage root. All PV data (Redis, OpenBao, Postgres, …) is
  # written here, so it survives cluster restarts and is visible on the host.
  #
  # The path below uses a placeholder that the install script replaces with the
  # absolute path to this repository before passing the config to k3d.
  # To create the cluster manually without the install script:
  #
  #   sed 's|REPO_ROOT_PLACEHOLDER|'"$(pwd)"'|g' \
  #     setup/k3d/config.yaml | k3d cluster create --config -
  - volume: REPO_ROOT_PLACEHOLDER/mnt:/var/lib/rancher/k3s/storage
    nodeFilters:
      - all

options:
  runtime:
    # Server node only runs control-plane components — 2g is sufficient.
    serversMemory: 2g
    agentsMemory: 4g
  k3s:
    extraArgs:
      # Taint the server node so no workloads schedule on it.
      # Each of the 3 agent nodes (4g) is dedicated to one PostgreSQL pod.
      - arg: "--node-taint=node-role.kubernetes.io/control-plane:NoSchedule"
        nodeFilters:
          - server:*
