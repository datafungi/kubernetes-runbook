# Triggers a base backup daily at 02:00 UTC.
# Requires the backup.barmanObjectStore block to be configured in cluster.yaml.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-cluster-backup
  namespace: default
spec:
  schedule: "0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: pg-cluster
