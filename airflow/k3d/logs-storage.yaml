# Airflow log storage — k3d
#
# setup/k3d/config.yaml mounts the repo's mnt/ directory into every k3d
# node container at /var/lib/rancher/k3s/storage. Because all agent nodes
# share the same underlying host directory, the hostPath PV at
# /var/lib/rancher/k3s/storage/airflow is accessible from any pod on any
# node — ReadWriteMany without requiring an NFS server.
#
# On the host, logs appear at:
#   <repo-root>/mnt/airflow/
#
# Prerequisite: the k3d cluster must be (re)created with the updated
# config.yaml that includes the mnt/airflow volume mount.
#
# Deploy order:
#   kubectl create namespace airflow   (if not already done)
#   kubectl apply -f airflow/k3d/logs-storage.yaml
#   # then helm install ...

apiVersion: v1
kind: PersistentVolume
metadata:
  name: airflow-logs
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: /var/lib/rancher/k3s/storage/airflow
    type: Directory
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # Pre-bind to the airflow namespace PVC so no other claim can take it.
  claimRef:
    namespace: airflow
    name: airflow-logs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-logs
  namespace: airflow
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: ""
  volumeName: airflow-logs
