# Airflow log storage — k3d
#
# setup/k3d/config.yaml mounts the repo's mnt/ directory into every k3d
# node container at /var/lib/rancher/k3s/storage. Because all agent nodes
# share the same underlying host directory, the hostPath PV at
# /var/lib/rancher/k3s/storage/airflow/logs is accessible from any pod on
# any node — ReadWriteMany without requiring an NFS server.
#
# On the host, logs appear at:
#   <repo-root>/mnt/airflow/logs/
#
# The install script creates mnt/airflow/logs/ before applying this manifest.
# DirectoryOrCreate is a safety net in case the directory is missing.

apiVersion: v1
kind: PersistentVolume
metadata:
  name: airflow-logs
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: /var/lib/rancher/k3s/storage/airflow/logs
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: airflow
    name: airflow-logs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-logs
  namespace: airflow
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: ""
  volumeName: airflow-logs
