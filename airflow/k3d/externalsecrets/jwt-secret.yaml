# JWT signing key for Airflow API authentication ([api_auth] jwt_secret).
# chart field: jwtSecretName (key: jwt-secret)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-jwt-secret
  namespace: airflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: airflow-jwt-secret
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: airflow/api
        property: jwt-secret
