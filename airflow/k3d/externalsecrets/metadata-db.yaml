# Metadata DB connection string — SQLAlchemy URI for AIRFLOW__DATABASE__SQL_ALCHEMY_CONN.
# Key is 'connection' as required by data.metadataSecretName in the Helm chart.
#
# Connects directly to the CNPG primary (pg-cluster-rw) to avoid advisory-lock
# and session-state restrictions imposed by PgBouncer transaction mode.
#
# The Celery result backend (db+postgresql://) is in a separate ExternalSecret
# (result-backend.yaml) because data.resultBackendSecretName also expects key
# 'connection' but with a different SQLAlchemy dialect prefix.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-metadata-db
  namespace: airflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: airflow-metadata-db
    template:
      data:
        connection: "postgresql+psycopg2://{{ .user }}:{{ .password }}@pg-cluster-rw.postgres.svc.cluster.local:5432/airflow"
  data:
    - secretKey: user
      remoteRef:
        key: airflow/metadata-db
        property: user
    - secretKey: password
      remoteRef:
        key: airflow/metadata-db
        property: password
