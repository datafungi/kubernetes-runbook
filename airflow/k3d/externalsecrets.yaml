# ESO ExternalSecrets for Apache Airflow — k3d
# All secrets are sourced from OpenBao via the 'openbao' ClusterSecretStore.
# Prerequisites: store the required secrets in OpenBao first (see README).
#
# Secrets created:
#   airflow-fernet-key    fernet-key       ← secret/airflow/fernet-key.fernet-key
#   airflow-api-secret    api-secret-key   ← secret/airflow/api.api-secret-key
#   airflow-jwt-secret    jwt-secret       ← secret/airflow/api.jwt-secret
#   airflow-metadata-db   connection       ← template: pg URI from secret/airflow/metadata-db
#                         result-backend   ← template: db+pg URI from same credentials
#   airflow-celery        broker-url       ← template: Sentinel URL from secret/redis.password
#   airflow-ssh-secret    gitSshKey        ← secret/airflow/git.private-key

# ── Fernet key ───────────────────────────────────────────────────────────────
# Used by Airflow to encrypt passwords and connection strings stored in the
# metadata database. chart field: fernetKeySecretName (key: fernet-key)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-fernet-key
  namespace: airflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: airflow-fernet-key
  data:
    - secretKey: fernet-key
      remoteRef:
        key: airflow/fernet-key
        property: fernet-key
---
# ── API server secret key ────────────────────────────────────────────────────
# Flask/ASGI secret key for the Airflow 3 API server ([api] secret_key).
# chart field: apiSecretKeySecretName (key: api-secret-key)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-api-secret
  namespace: airflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: airflow-api-secret
  data:
    - secretKey: api-secret-key
      remoteRef:
        key: airflow/api
        property: api-secret-key
---
# ── JWT signing secret ────────────────────────────────────────────────────────
# Used to sign and verify JWTs for Airflow API authentication
# ([api_auth] jwt_secret). chart field: jwtSecretName (key: jwt-secret)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-jwt-secret
  namespace: airflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: airflow-jwt-secret
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: airflow/api
        property: jwt-secret
---
# ── Metadata DB + Celery result backend ──────────────────────────────────────
# ESO templates build full connection strings from stored credentials.
#   connection     → SQLAlchemy URI (AIRFLOW__DATABASE__SQL_ALCHEMY_CONN)
#   result-backend → Celery result backend (db+postgresql://)
#
# Connects directly to the CNPG primary (pg-cluster-rw) to avoid
# advisory-lock and session-state restrictions imposed by PgBouncer
# transaction mode.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-metadata-db
  namespace: airflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: airflow-metadata-db
    template:
      data:
        connection: "postgresql+psycopg2://{{ .user }}:{{ .password }}@pg-cluster-rw.postgres.svc.cluster.local:5432/airflow"
        result-backend: "db+postgresql://{{ .user }}:{{ .password }}@pg-cluster-rw.postgres.svc.cluster.local:5432/airflow"
  data:
    - secretKey: user
      remoteRef:
        key: airflow/metadata-db
        property: user
    - secretKey: password
      remoteRef:
        key: airflow/metadata-db
        property: password
---
# ── Celery broker (Redis Sentinel) ───────────────────────────────────────────
# Reuses the existing Redis password at secret/redis (no new OpenBao path).
# The non-sensitive master_name is set via config.AIRFLOW__CELERY__BROKER_TRANSPORT_OPTIONS
# in values.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-celery
  namespace: airflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: airflow-celery
    template:
      data:
        broker-url: "sentinel://:{{ .redisPassword }}@sentinel-0.sentinel.redis.svc.cluster.local:26379;sentinel-1.sentinel.redis.svc.cluster.local:26379;sentinel-2.sentinel.redis.svc.cluster.local:26379/0"
  data:
    - secretKey: redisPassword
      remoteRef:
        key: redis
        property: password
---
# ── Git SSH key (for GitSync sidecar) ────────────────────────────────────────
# The chart's dags.gitSync mounts this secret into the dag-processor and
# worker pods. Key name gitSshKey is required by the git-sync container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-ssh-secret
  namespace: airflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: airflow-ssh-secret
  data:
    - secretKey: gitSshKey
      remoteRef:
        key: airflow/git
        property: private-key
