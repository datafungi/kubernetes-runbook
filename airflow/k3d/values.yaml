# Apache Airflow Helm Chart — k3d base values
# Chart:    apache-airflow/airflow  v1.21.0
# App:      Apache Airflow          3.2.0
# Executor: CeleryExecutor
# Database: external PostgreSQL (CNPG pg-cluster — direct primary, no PgBouncer)
# Broker:   external Redis Sentinel (OpsTree — sentinel-{0,1,2}.sentinel.redis)
# Logs:     hostPath PVC (ReadWriteMany, shared across all k3d nodes — see logs-storage.yaml)
#
# DAG loading is configured by an overlay file merged on top of this base:
#   -f values-gitsync.yaml   git-sync sidecar (SSH)
#   -f values-local.yaml     hostPath PVC (mnt/airflow/dags/ on the host)
#
# Airflow 3.x component changes vs 2.x:
#   - apiServer    replaces webserver ('airflow api-server', port 8080)
#   - dagProcessor is a new required component ('airflow dag-processor')
#   - apiSecretKeySecretName + jwtSecretName replace webserverSecretKeySecretName
#
# All credentials are injected from Kubernetes Secrets created by ESO.
# No plaintext passwords appear in this file.

airflowVersion: "3.2.0"
defaultAirflowTag: "3.2.0"

executor: "CeleryExecutor"

# ── Secrets ──────────────────────────────────────────────────────────────────
# Kubernetes Secrets are created by ESO (see externalsecrets/).
data:
  metadataSecretName: airflow-metadata-db       # must have key: connection
  brokerUrlSecretName: airflow-celery           # must have key: connection
  resultBackendSecretName: airflow-result-backend  # must have key: connection

# Top-level (not inside data:) in chart 1.21.0
fernetKeySecretName: airflow-fernet-key         # must have key: fernet-key

# Airflow 3: API server secret key ([api] secret_key in airflow.cfg)
apiSecretKeySecretName: airflow-api-secret      # must have key: api-secret-key

# Airflow 3: JWT signing key ([api_auth] jwt_secret in airflow.cfg)
jwtSecretName: airflow-jwt-secret              # must have key: jwt-secret

# ── Airflow configuration (non-sensitive) ────────────────────────────────────
# Rendered into a ConfigMap by the chart. Use TOML-style nested keys (chart 1.21.0).
# Do not put secrets here.
config:
  core:
    load_examples: 'False'
  celery:
    # Required for CeleryExecutor with Redis Sentinel:
    # tells Kombu/Celery which Sentinel master group to follow.
    broker_transport_options: '{"master_name": "myMaster"}'

# ── Logs: persistent volume ───────────────────────────────────────────────────
# The PVC is created by logs-storage.yaml (hostPath, ReadWriteMany).
# All Airflow pods can write logs regardless of which agent node they land on
# because mnt/airflow/logs/ is bind-mounted into every k3d node container.
logs:
  persistence:
    enabled: true
    existingClaim: airflow-logs

# ── API Server (Airflow 3.x, replaces webserver) ──────────────────────────────
# Runs 'airflow api-server'. Serves the UI and REST API on port 8080.
apiServer:
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# ── DAG Processor (Airflow 3.x, required) ────────────────────────────────────
# Runs 'airflow dag-processor'. Parses and registers DAG files separately
# from the scheduler. Auto-enabled by the chart for airflowVersion >= 3.0.0.
dagProcessor:
  logGroomerSidecar:
    enabled: false   # disabled: log persistence handles retention
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ── Scheduler ─────────────────────────────────────────────────────────────────
scheduler:
  logGroomerSidecar:
    enabled: false
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# ── Workers ───────────────────────────────────────────────────────────────────
workers:
  replicas: 1
  celery:
    logGroomerSidecar:
      enabled: false
    resources:
      requests:
        cpu: "500m"
        memory: "768Mi"
      limits:
        cpu: "1"
        memory: "2Gi"

# ── Triggerer ─────────────────────────────────────────────────────────────────
triggerer:
  logGroomerSidecar:
    enabled: false
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ── Disable bundled PostgreSQL and Redis ──────────────────────────────────────
postgresql:
  enabled: false

redis:
  enabled: false

# ── PgBouncer (chart built-in) ────────────────────────────────────────────────
# Disabled: the CNPG cluster provides a PgBouncer pooler at pg-cluster-pooler-rw.
# Airflow's metadata connection bypasses it (see externalsecrets/metadata-db.yaml)
# to avoid transaction-mode restrictions.
pgbouncer:
  enabled: false
